<script>
'use strict';
// O desenho em si só se vê: quem o muda grava uma versão nova. No painel, a página mostra a versão mais nova do disco.
// Publicada, ela não traz dado nenhum: recebe o desenho do banco depois de validar o link pessoal, e ganha comentários por item.
const NOME = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');
const NS = 'http://www.w3.org/2000/svg';
const $ = (s) => document.querySelector(s);
const COR = {
  neutro: ['#151515', '#ffffff'], azul: ['#1f5fbf', '#eaf1fb'], verde: ['#2e7d32', '#eaf5eb'],
  amarelo: ['#b07a0c', '#fff6d8'], vermelho: ['#c0392b', '#fcecea'],
};
const tinta = (c) => (COR[c] || COR.neutro)[0];
const tinte = (c) => (COR[c] || COR.neutro)[1];
const colorido = (c) => c && c !== 'neutro';
const TEXTO = '#151515', SUAVE = '#5f5f5a';

const PUB = window.DESENHO_PUBLICADO || null;
// Os comentários ficam na dica de cada item. A lista de conversas e os comentários no painel lateral estão ocultos por ora (04/11).
const CONVERSAS = false;
// Nos detalhes, o trecho que começa assim vai para o fim, sob o título "De onde vem": a consulta, o campo e o valor de cada constatação.
const FONTE = '**De onde vem**';

let doc = null, pag = 0, abaPedida = false, caixas = {}, registro = {}, comentarios = [], acionaveis = [], token = null, aberto = null, eu = null, organizador = false;
// Seções que recolhem: uma caixa com "recolhe": [ids] resume um trecho do desenho e ganha um botão que mostra ou esconde esses itens.
// "recolhido": true faz a seção abrir fechada. O que a pessoa abriu vale até recarregar a página.
const dobras = {};
const dobraAberta = (it) => dobras[`${pag}:${it.id}`] ?? !it.recolhido;

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// Marcação curta nos textos: **negrito**, ~~sai~~, ++entra++, ??decidir??, `código`
const MARCA = /(\*\*.+?\*\*|~~.+?~~|\+\+.+?\+\+|\?\?.+?\?\?|`.+?`)/;
const html = (s) => String(s ?? '').split(MARCA).map((p) => {
  if (/^\*\*.+\*\*$/.test(p)) return `<b>${esc(p.slice(2, -2))}</b>`;
  if (/^~~.+~~$/.test(p)) return `<span class="s">${esc(p.slice(2, -2))}</span>`;
  if (/^\+\+.+\+\+$/.test(p)) return `<span class="e">${esc(p.slice(2, -2))}</span>`;
  if (/^\?\?.+\?\?$/.test(p)) return `<span class="d">${esc(p.slice(2, -2))}</span>`;
  if (/^`.+`$/.test(p)) return `<code>${esc(p.slice(1, -1))}</code>`;
  return esc(p);
}).join('');

function el(tag, attrs, pai) {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v !== undefined && v !== null && v !== false) n.setAttribute(k, v);
  if (pai) pai.appendChild(n);
  return n;
}

function texto(pai, x, y, s, o = {}) {
  const t = el('text', { x, y, 'font-size': o.tam || 12, fill: o.cor || TEXTO, 'font-weight': o.peso, 'text-anchor': o.ancora }, pai);
  for (const p of String(s ?? '').split(MARCA)) {
    if (!p) continue;
    const ts = el('tspan', {}, t);
    if (/^\*\*.+\*\*$/.test(p)) { ts.textContent = p.slice(2, -2); ts.setAttribute('font-weight', 700); }
    else if (/^~~.+~~$/.test(p)) { ts.textContent = p.slice(2, -2); ts.setAttribute('fill', tinta('vermelho')); ts.setAttribute('text-decoration', 'line-through'); }
    else if (/^\+\+.+\+\+$/.test(p)) { ts.textContent = p.slice(2, -2); ts.setAttribute('fill', tinta('verde')); ts.setAttribute('font-weight', 600); }
    else if (/^\?\?.+\?\?$/.test(p)) { ts.textContent = p.slice(2, -2); ts.setAttribute('fill', tinta('amarelo')); ts.setAttribute('font-weight', 600); }
    else if (/^`.+`$/.test(p)) { ts.textContent = p.slice(1, -1); ts.setAttribute('font-family', 'Consolas, monospace'); }
    else ts.textContent = p;
  }
  if (o.max) caber(t, o.max);
  return t;
}

// Corta com reticências o que não cabe; o texto inteiro continua na dica.
function caber(t, max) {
  if (t.getComputedTextLength() <= max) return;
  const spans = [...t.querySelectorAll('tspan')];
  while (spans.length) {
    const ult = spans[spans.length - 1];
    let s = ult.textContent.replace(/…$/, '');
    while (s.length && t.getComputedTextLength() > max) { s = s.slice(0, -1); ult.textContent = s.trimEnd() + '…'; }
    if (t.getComputedTextLength() <= max) return;
    ult.remove(); spans.pop();
  }
}

const semMarca = (s) => String(s ?? '').replace(/\*\*|~~|\+\+|\?\?|`/g, '');

// Links de um item para o console onde ele está configurado: { t, url }. Só https e só os endereços da lista;
// o resto é ignorado. Abrem em outra aba, sem levar o endereço desta página.
const HOSTS = ['console.cloud.google.com', 'dev.azure.com', 'hpanel.hostinger.com'];
const linkSeguro = (l) => { try { const u = new URL(l?.url); return u.protocol === 'https:' && HOSTS.includes(u.hostname) ? u.href : null; } catch { return null; } };
const linksDe = (lista) => (Array.isArray(lista) ? lista : []).filter((l) => linkSeguro(l));
const linksHtml = (lista) => {
  const ok = linksDe(lista);
  return ok.length ? `<div class="links">${ok.map((l) => `<a href="${esc(linkSeguro(l))}" target="_blank" rel="noopener noreferrer">${esc(l.t || new URL(l.url).hostname)} ↗</a>`).join('')}</div>` : '';
};
const SETA = (pai, x, y) => texto(pai, x, y, '↗', { tam: 13, peso: 700, cor: tinta('azul'), ancora: 'end' });

// Item clicável: o id é estável, então a mesma conta em duas listas, ou nas duas abas, é uma conversa só.
function marcar(g, id, rotulo, dica, detalhes, lado, links) {
  if (!id) return;
  g.setAttribute('data-item', id);
  g.classList.add('item');
  if (lado) g.dataset.lado = lado;
  const r = (registro[id] ||= { rotulo: semMarca(rotulo), dica, detalhes: [], links: [] });
  for (const d of detalhes || []) if (!r.detalhes.includes(d)) r.detalhes.push(d);
  for (const l of linksDe(links)) if (!r.links.some((x) => x.url === l.url)) r.links.push(l);
}

const icone = (pai, nome, x, y, tam, cor) => el('use', { href: `#i-${nome}`, x, y, width: tam, height: tam, style: `color:${cor}` }, pai);

// Selos: etiquetas pequenas, em linha, que quebram quando não cabem. Devolve a base da última linha.
function selos(g, lista, x0, y0, xmax) {
  let x = x0, y = y0;
  for (const s of lista) {
    const sg = el('g', { 'data-dica': s.dica }, g);
    const c = colorido(s.cor) ? tinta(s.cor) : TEXTO;
    const t = texto(sg, 0, 0, s.t, { tam: 11.5, cor: c, peso: 600 });
    const w = t.getComputedTextLength() + 14 + (s.icone ? 17 : 0);
    if (x + w > xmax && x > x0) { x = x0; y += 25; }
    t.setAttribute('x', x + 7 + (s.icone ? 17 : 0));
    t.setAttribute('y', y + 14.5);
    sg.insertBefore(el('rect', { x, y, width: w, height: 21, fill: tinte(s.cor), stroke: colorido(s.cor) ? c : '#8a8a84', 'stroke-width': 1 }), t);
    if (s.icone) icone(sg, s.icone, x + 6, y + 3.5, 14, c);
    x += w + 6;
  }
  return y + 21;
}

function posicao(it) {
  // "abaixo" empilha um item sob outro já desenhado, com folga de 14
  if (it.abaixo && caixas[it.abaixo]) { const c = caixas[it.abaixo]; return [it.x ?? c.x, c.y + c.h + (it.folga ?? 14)]; }
  return [it.x, it.y];
}

// Caixa com ícone, título, linhas curtas e selos. "centro" põe tudo centralizado, com o ícone em cima.
function no(g, it) {
  const [x, y0] = posicao(it);
  const c = tinta(it.cor), riscado = it.estado === 'removido';
  const ng = el('g', { 'data-dica': it.dica }, g);
  const ti = it.grande ? 40 : it.centro ? 30 : 26;
  let y;
  if (it.centro) {
    const cx = x + it.w / 2;
    icone(ng, it.icone || 'caixa', cx - ti / 2, y0 + 14, ti, colorido(it.cor) ? c : TEXTO);
    y = y0 + 14 + ti + 18;
    const tt = texto(ng, cx, y, it.titulo, { tam: 13, peso: 700, ancora: 'middle', cor: colorido(it.cor) ? c : TEXTO, max: it.w - 12 });
    if (riscado) tt.setAttribute('text-decoration', 'line-through');
    for (const l of it.linhas || []) { y += 16; texto(ng, cx, y, l, { tam: 12, cor: '#33332f', ancora: 'middle', max: it.w - 12 }); }
    y += 10;
    if (it.selos?.length) y = selos(ng, it.selos, x + 8, y, x + it.w - 8) + 8;
  } else {
    const xt = x + 12 + ti + 10, max = x + it.w - 10 - xt;
    // Seção que recolhe: o botão fica no canto de cima, à direita, e as duas primeiras linhas de texto deixam lugar para ele
    let reserva = 0;
    if (it.id && it.recolhe?.length) {
      const aberta = dobraAberta(it);
      const dg = el('g', { class: 'dobra', 'data-dobra': it.id, role: 'button', tabindex: 0, 'aria-expanded': String(aberta), 'aria-label': aberta ? 'Recolher esta seção' : 'Abrir o detalhe desta seção' }, ng);
      const rot = texto(dg, 0, y0 + 24.5, aberta ? 'Recolher' : `Abrir o detalhe (${it.recolhe.length})`, { tam: 11.5, peso: 600 });
      const wd = rot.getComputedTextLength() + 31, xd = x + it.w - 10 - wd;
      rot.setAttribute('x', xd + 23);
      dg.insertBefore(el('rect', { x: xd, y: y0 + 10, width: wd, height: 21, fill: '#fff', stroke: TEXTO, 'stroke-width': 1.2 }), rot);
      el('path', { d: aberta ? `M${xd + 7} ${y0 + 18}l4.5 5 4.5-5` : `M${xd + 9} ${y0 + 16}l5 4.5-5 4.5`, fill: 'none', stroke: TEXTO, 'stroke-width': 1.8 }, dg);
      reserva = wd + 10;
    }
    // a primeira linha de texto deixa lugar para a seta do link, no canto de cima
    const maxTopo = max - (it.id && linksDe(it.links).length ? 16 : 0) - reserva;
    y = y0 + 22;
    if (it.sobre) { texto(ng, xt, y - 2, it.sobre, { tam: 10.5, peso: 700, cor: colorido(it.cor) ? c : SUAVE, max: maxTopo }); y += 17; }
    const tt = texto(ng, xt, y, it.titulo, { tam: it.grande ? 15 : 13, peso: 700, cor: riscado ? c : TEXTO, max: it.sobre ? max - reserva : maxTopo });
    if (riscado) tt.setAttribute('text-decoration', 'line-through');
    for (const l of it.linhas || []) { y += 16; texto(ng, xt, y, l, { tam: 12, cor: '#33332f', max }); }
    y = Math.max(y + 12, y0 + 12 + ti + 10);
    if (it.selos?.length) y = selos(ng, it.selos, x + 12, y, x + it.w - 10) + 10;
    icone(ng, it.icone || 'caixa', x + 12, y0 + 13, ti, colorido(it.cor) ? c : TEXTO);
  }
  const h = Math.max(it.h || 0, y - y0);
  const fundo = it.vazado ? 'none' : tinte(it.cor);
  const borda = riscado || it.tracejada ? c : TEXTO;
  const r = el('rect', { class: 'base', x, y: y0, width: it.w, height: h, fill: fundo, stroke: borda, 'stroke-width': it.vazado ? 1.5 : 1.2, 'stroke-dasharray': riscado || it.tracejada ? '6 4' : null });
  ng.insertBefore(r, ng.firstChild);
  if (colorido(it.cor) && !it.vazado) ng.insertBefore(el('rect', { x, y: y0, width: it.w, height: 4, fill: c }), r.nextSibling);
  caixas[it.id] = { x, y: y0, w: it.w, h };
  if (it.id && linksDe(it.links).length) SETA(ng, x + it.w - 7, y0 + 19);
  marcar(ng, it.id, it.titulo, it.dica, [...(it.detalhes || []), ...(it.selos || []).filter((s) => s.dica).map((s) => `**${s.t}:** ${s.dica}`)], undefined, it.links);
}

// Chave exportada: o número de chaves, em vermelho quando alguma está parada; "5→2" quando a correção apaga as paradas.
function chave(g, m, xd, y) {
  const depois = m.depois != null;
  const cor = depois ? tinta('verde') : m.paradas > 0 ? tinta('vermelho') : SUAVE;
  const t = texto(g, 0, y + 14, depois ? `${m.chaves}→${m.depois}` : String(m.chaves), { tam: 11, cor, peso: 700 });
  const w = t.getComputedTextLength();
  t.setAttribute('x', xd - w);
  icone(g, 'chave', xd - w - 16, y + 3.5, 13, cor);
  return xd - w - 22;
}

// Lista de contas sob um título: cada linha com ícone, nome, nota e chaves.
function lista(g, it) {
  const [x, y0] = posicao(it);
  const c = tinta(it.cor);
  const lg = el('g', {}, g);
  const fundo = el('rect', { x, y: y0, width: it.w, height: 0, fill: '#fff' }, lg);
  const hCab = it.sub ? 44 : 29;
  const cab = el('g', { 'data-dica': it.dica }, lg);
  el('rect', { class: 'base', x, y: y0, width: it.w, height: hCab, fill: tinte(it.cor) }, cab);
  marcar(cab, it.id, it.titulo, it.dica, it.detalhes, 'esq', it.links);
  if (colorido(it.cor)) el('rect', { x, y: y0, width: it.w, height: 4, fill: c }, cab);
  let xt = x + 10, xr = x + it.w - 10;
  if (it.icone) { icone(cab, it.icone, x + 9, y0 + 8, 16, colorido(it.cor) ? c : TEXTO); xt += 23; }
  if (it.id && linksDe(it.links).length) { SETA(cab, xr, y0 + 20); xr -= 17; }
  const conta = it.conta != null ? texto(cab, xr, y0 + 21, String(it.conta), { tam: 12.5, peso: 700, cor: colorido(it.cor) ? c : TEXTO, ancora: 'end' }) : null;
  texto(cab, xt, y0 + 21, it.titulo, { tam: 12.5, peso: 700, max: xr - xt - (conta ? conta.getComputedTextLength() + 8 : 0) });
  if (it.sub) texto(cab, xt, y0 + 37, it.sub, { tam: 11.5, cor: SUAVE, max: x + it.w - 10 - xt });
  let y = y0 + hCab + 4;
  for (const m of it.membros || []) {
    const mg = el('g', { 'data-dica': m.dica || m.t }, lg);
    el('rect', { class: 'base', x: x + 1, y, width: it.w - 2, height: 20, fill: m.estado === 'novo' ? tinte('verde') : 'transparent' }, mg);
    marcar(mg, m.id || m.t, m.t, m.dica, m.detalhes, 'esq', m.links);
    const corM = m.estado === 'removido' ? tinta('vermelho') : m.estado === 'novo' ? tinta('verde') : TEXTO;
    icone(mg, m.icone || 'pessoa', x + 9, y + 3, 14, corM);
    let xd = x + it.w - 9;
    if (linksDe(m.links).length) { SETA(mg, xd, y + 15); xd -= 17; }
    if (m.chaves) xd = chave(mg, m, xd, y);
    if (m.nota) {
      const n = texto(mg, xd, y + 14, m.nota, { tam: 11, cor: colorido(m.notaCor) ? tinta(m.notaCor) : SUAVE, ancora: 'end' });
      xd -= n.getComputedTextLength() + 10;
    }
    const nome = texto(mg, x + 30, y + 14, m.t, { tam: 12, cor: corM, max: xd - (x + 30) });
    if (m.estado === 'removido') nome.setAttribute('text-decoration', 'line-through');
    y += 20;
  }
  const h = y + 4 - y0;
  fundo.setAttribute('height', h);
  el('line', { x1: x, y1: y0 + hCab, x2: x + it.w, y2: y0 + hCab, stroke: TEXTO, 'stroke-width': 1 }, lg);
  el('rect', { x, y: y0, width: it.w, height: h, fill: 'none', stroke: TEXTO, 'stroke-width': 1.2 }, lg);
  caixas[it.id] = { x, y: y0, w: it.w, h };
}

// Grade de fichas pequenas (os buckets menores), com um título em cima.
function grade(g, it) {
  const [x, y0] = posicao(it);
  const gg = el('g', {}, g);
  let y = y0;
  if (it.titulo) {
    const tg = el('g', { 'data-dica': it.dica }, gg);
    texto(tg, x, y + 12, it.titulo, { tam: 12, peso: 700, cor: colorido(it.cor) ? tinta(it.cor) : TEXTO });
    y += 20;
  }
  const cols = it.colunas || 1, folga = 6, hf = 24;
  const wf = (it.w - folga * (cols - 1)) / cols;
  it.fichas.forEach((f, i) => {
    const fx = x + (i % cols) * (wf + folga), fy = y + Math.floor(i / cols) * (hf + folga);
    const cor = f.cor || it.corFichas || 'neutro';
    const fg = el('g', { 'data-dica': f.dica || f.t }, gg);
    marcar(fg, f.id || f.t, f.t, f.dica, f.detalhes, undefined, f.links);
    el('rect', { class: 'base', x: fx, y: fy, width: wf, height: hf, fill: tinte(cor), stroke: colorido(cor) ? tinta(cor) : '#9a9a94', 'stroke-width': 1, 'stroke-dasharray': f.estado === 'removido' ? '4 3' : null }, fg);
    icone(fg, f.icone || it.icone || 'bucket', fx + 6, fy + 5, 14, colorido(cor) ? tinta(cor) : TEXTO);
    let xd = fx + wf - 7;
    if (f.sub) { const s = texto(fg, xd, fy + 16, f.sub, { tam: 11, cor: SUAVE, ancora: 'end' }); xd -= s.getComputedTextLength() + 8; }
    texto(fg, fx + 26, fy + 16, f.t, { tam: 11.5, max: xd - (fx + 26) });
  });
  const linhas = Math.ceil(it.fichas.length / cols);
  caixas[it.id] = { x, y: y0, w: it.w, h: y - y0 + linhas * (hf + folga) - folga };
}

function rotuloLivre(g, it) {
  const [x, y] = posicao(it);
  const tg = el('g', { 'data-dica': it.dica }, g);
  String(it.t).split('\n').forEach((l, i) => texto(tg, x, y + i * 17, l, { tam: it.tam || 12.5, peso: it.peso ?? 700, cor: colorido(it.cor) ? tinta(it.cor) : SUAVE }));
}

// Área (projeto, organização): moldura com aba preta; a altura pode seguir o que ela contém.
function area(g, it) {
  let { x, y, w, h } = it;
  if (it.contem) {
    const dentro = it.contem.map((id) => caixas[id]).filter(Boolean);
    h = Math.max(h || 0, Math.max(...dentro.map((c) => c.y + c.h)) + (it.margem ?? 20) - y);
  }
  const c = tinta(it.cor);
  el('rect', { x, y, width: w, height: h, fill: 'none', stroke: c, 'stroke-width': 1.5, 'stroke-dasharray': it.tracejada ? '7 5' : null }, g);
  const tg = el('g', { 'data-dica': it.dica }, g);
  const t = texto(tg, x + (it.icone ? 32 : 10), y + 18, it.titulo + (it.id && linksDe(it.links).length ? '  ↗' : ''), { tam: 12.5, peso: 700, cor: '#fff' });
  tg.insertBefore(el('rect', { x, y, width: t.getComputedTextLength() + (it.icone ? 44 : 22), height: 27, fill: c }), t);
  if (it.icone) icone(tg, it.icone, x + 8, y + 4.5, 18, '#fff');
  marcar(tg, it.id, it.titulo, it.dica, [...(it.detalhes || []), ...(it.selos || []).filter((s) => s.dica).map((s) => `**${s.t}:** ${s.dica}`)], undefined, it.links);
  if (it.selos?.length) {
    // selos da área: em linha, encostados no canto de cima, à direita
    const sg = el('g', {}, g);
    selos(sg, it.selos, 0, 0, 1e6);
    sg.setAttribute('transform', `translate(${x + w - 10 - sg.getBBox().width} ${y + 7})`);
  }
  caixas[it.id] = { x, y, w, h };
}

// ---------------------------------------------------------------- ligações

const ponto = ([x, y]) => ({ x, y, w: 0, h: 0 });
const ancora = (c, [fx, fy]) => [c.x + c.w * fx, c.y + c.h * fy];
const limitar = (v, a, b) => Math.max(a, Math.min(b, v));

// Sai pelo lado de A voltado para B; quando as faixas se cruzam, a linha fica reta.
function porta(A, B) {
  if (B.x >= A.x + A.w || B.x + B.w <= A.x) {
    const x = B.x >= A.x + A.w ? A.x + A.w : A.x;
    const lo = Math.max(A.y, B.y), hi = Math.min(A.y + A.h, B.y + B.h);
    return [x, lo <= hi ? (lo + hi) / 2 : limitar(B.y + B.h / 2, A.y + 10, A.y + A.h - 10)];
  }
  const y = B.y >= A.y + A.h ? A.y + A.h : A.y;
  const lo = Math.max(A.x, B.x), hi = Math.min(A.x + A.w, B.x + B.w);
  return [lo <= hi ? (lo + hi) / 2 : limitar(B.x + B.w / 2, A.x + 10, A.x + A.w - 10), y];
}

function rota(A, B, l) {
  let pA = l.da ? ancora(A, l.da) : null, pB = l.pa ? ancora(B, l.pa) : null;
  const via = (l.via || []).map((p) => [...p]);
  if (l.cotovelo != null) {
    // Em L: anda na horizontal até x = cotovelo e entra em B na vertical
    pA = pA || porta(A, ponto([l.cotovelo, A.y + A.h / 2]));
    via.push([l.cotovelo, pA[1]]);
  }
  if (!pA) pA = porta(A, via[0] ? ponto(via[0]) : pB ? ponto(pB) : B);
  if (!pB) pB = porta(B, ponto(via.length ? via[via.length - 1] : pA));
  return [pA, ...via, pB];
}

function pontaSeta(g, p, q, cor) {
  const a = Math.atan2(p[1] - q[1], p[0] - q[0]), L = 10, W = 4.8;
  const b = [p[0] - L * Math.cos(a), p[1] - L * Math.sin(a)], n = [-Math.sin(a) * W, Math.cos(a) * W];
  el('path', { d: `M${p[0]} ${p[1]}L${b[0] + n[0]} ${b[1] + n[1]}L${b[0] - n[0]} ${b[1] - n[1]}Z`, fill: cor }, g);
}

// Negado: um ✕ num quadrado, encostado onde a linha bate
function pontaBloqueio(g, p, q, cor) {
  const a = Math.atan2(p[1] - q[1], p[0] - q[0]);
  const cx = p[0] - 10 * Math.cos(a), cy = p[1] - 10 * Math.sin(a);
  el('rect', { x: cx - 9, y: cy - 9, width: 18, height: 18, fill: '#fff', stroke: cor, 'stroke-width': 1.6 }, g);
  el('path', { d: `M${cx - 4.5} ${cy - 4.5}L${cx + 4.5} ${cy + 4.5}M${cx + 4.5} ${cy - 4.5}L${cx - 4.5} ${cy + 4.5}`, stroke: cor, 'stroke-width': 2.2 }, g);
}

function rotuloLigacao(g, pts, s, cor, frac) {
  const segs = pts.slice(1).map((p, i) => Math.hypot(p[0] - pts[i][0], p[1] - pts[i][1]));
  let resta = segs.reduce((a, b) => a + b, 0) * frac, i = 0;
  while (i < segs.length - 1 && resta > segs[i]) { resta -= segs[i]; i++; }
  const t0 = segs[i] ? resta / segs[i] : 0;
  const x = pts[i][0] + (pts[i + 1][0] - pts[i][0]) * t0, y = pts[i][1] + (pts[i + 1][1] - pts[i][1]) * t0;
  const linhas = String(s).split('\n');
  const tg = el('g', {}, g);
  const ts = linhas.map((l, k) => texto(tg, x, y + 4 + (k - (linhas.length - 1) / 2) * 15, l, { tam: 11.5, cor, peso: 600, ancora: 'middle' }));
  const w = Math.max(...ts.map((t) => t.getComputedTextLength())) + 12, h = linhas.length * 15 + 6;
  tg.insertBefore(el('rect', { x: x - w / 2, y: y - h / 2, width: w, height: h, fill: '#fff', stroke: cor, 'stroke-width': 1 }), tg.firstChild);
}

function ligacao(fios, pontas, l) {
  const A = caixas[l.de], B = caixas[l.para];
  if (!A || !B) return;
  const cor = tinta(l.cor || 'neutro');
  const pts = rota(A, B, l);
  el('path', { d: 'M' + pts.map((p) => p.join(' ')).join('L'), fill: 'none', stroke: cor, 'stroke-width': 1.7, 'stroke-dasharray': l.tracejada ? '7 5' : null, 'data-dica': l.dica }, fios);
  // uma faixa larga e invisível por cima, para a dica pegar a linha com facilidade
  if (l.dica) el('path', { d: 'M' + pts.map((p) => p.join(' ')).join('L'), fill: 'none', stroke: 'transparent', 'stroke-width': 12, 'data-dica': l.dica }, pontas);
  const g = el('g', { 'data-dica': l.dica }, pontas);
  const fim = pts[pts.length - 1], antes = pts[pts.length - 2];
  if (l.fim === 'bloqueio') pontaBloqueio(g, fim, antes, cor);
  else if (l.fim !== 'nenhum') pontaSeta(g, fim, antes, cor);
  if (l.rotulo) rotuloLigacao(g, pts, l.rotulo, cor, l.rt ?? 0.5);
}

// ---------------------------------------------------------------- página

// Quantos comentários cada item tem: um quadrado azul no canto da caixa, ou à esquerda da linha.
function contadores(pontas) {
  const n = {};
  for (const c of comentarios) n[c.item] = (n[c.item] || 0) + 1;
  for (const g of document.querySelectorAll('#quadro [data-item]')) {
    const qtd = n[g.dataset.item];
    if (!qtd) continue;
    const b = g.getBBox();
    const x = g.dataset.lado === 'esq' ? b.x - 19 : b.x + b.width - 10, y = g.dataset.lado === 'esq' ? b.y + 2 : b.y - 8;
    const m = el('g', { style: 'pointer-events:none' }, pontas);
    el('rect', { x, y, width: 17, height: 16, fill: tinta('azul') }, m);
    texto(m, x + 8.5, y + 12, qtd, { tam: 11, peso: 700, cor: '#fff', ancora: 'middle' });
  }
}

function desenhar() {
  const p = doc.paginas[pag];
  caixas = {};
  registro = {};
  $('#nota').innerHTML = p.nota ? html(p.nota) : '';
  const quadro = $('#quadro');
  quadro.innerHTML = '';
  const svg = el('svg', { 'font-family': '"Segoe UI", system-ui, sans-serif' }, quadro);
  const fundo = el('g', {}, svg), fios = el('g', {}, svg), itens = el('g', {}, svg), pontas = el('g', {}, svg);
  const areas = [];
  // os itens de uma seção recolhida não são desenhados; as ligações deles somem junto (sem caixa, não há ligação)
  const recolhidos = new Set(p.itens.filter((it) => it.id && it.recolhe?.length && !dobraAberta(it)).flatMap((it) => it.recolhe));
  if (aberto && recolhidos.has(aberto)) fecharLateral();
  for (const it of p.itens) {
    if (recolhidos.has(it.id)) continue;
    if (it.tipo === 'area') { areas.push(it); continue; }
    ({ no, lista, grade, rotulo: rotuloLivre }[it.tipo] || no)(itens, it);
  }
  for (const a of areas) area(fundo, a);
  for (const l of p.ligacoes || []) ligacao(fios, pontas, l);
  contadores(pontas);
  const bb = svg.getBBox();
  const W = Math.max(p.largura || 0, bb.x + bb.width + 20), H = bb.y + bb.height + 20;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.style.aspectRatio = `${W} / ${H}`;
  // cada botão guarda o número da página dele: com abas ocultas, a posição na fileira deixa de ser o número
  document.querySelectorAll('.aba').forEach((a) => { const sim = Number(a.dataset.aba) === pag; a.classList.toggle('ativa', sim); a.setAttribute('aria-selected', String(sim)); });
  $('#ocultas').classList.toggle('cheia', !!p.oculta);
  $('#ocultas').textContent = p.oculta ? `Abas ocultas: ${p.nome}` : 'Abas ocultas';
  document.querySelectorAll('#ocultas-menu button').forEach((b) => b.setAttribute('aria-current', String(Number(b.dataset.aba) === pag)));
  if (aberto) abrirItem(aberto);
}

// O botão de uma seção que recolhe: um clique (ou Enter) mostra ou esconde os itens dela e redesenha a aba
function alternarDobra(id) {
  const it = doc.paginas[pag].itens.find((i) => i.id === id);
  if (!it) return;
  dobras[`${pag}:${id}`] = !dobraAberta(it);
  esconderDica();
  desenhar();
  if (porTeclado) document.querySelector(`#quadro [data-dobra="${CSS.escape(id)}"]`)?.focus({ preventScroll: true });
}
$('#quadro').addEventListener('click', (e) => { const d = e.target.closest?.('[data-dobra]'); if (d) alternarDobra(d.dataset.dobra); });
$('#quadro').addEventListener('keydown', (e) => {
  const d = (e.key === 'Enter' || e.key === ' ') && e.target.closest?.('[data-dobra]');
  if (d) { e.preventDefault(); alternarDobra(d.dataset.dobra); }
});

// ---------------------------------------------------------------- painel lateral

const dataHora = (iso) => new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
const cartao = (c) => `<div class="coment${c.autor === '3Neuron' ? ' nosso' : ''}"><div class="cq"><b>${esc(c.autor)}</b><span>${esc(dataHora(c.criado_em))}</span></div><div class="ct">${esc(c.texto)}</div></div>`;

function mostrarLateral() {
  $('#lateral').classList.add('aberto');
  document.body.classList.add('com-lateral');
}

function realcar() {
  document.querySelectorAll('#quadro .item').forEach((g) => g.classList.toggle('ativo', g.dataset.item === aberto));
}

function abrirItem(id) {
  aberto = id;
  const r = registro[id];
  const conversa = comentarios.filter((c) => c.item === id);
  $('#ltitulo').textContent = r?.rotulo || conversa[0]?.rotulo || id;
  const todos = r?.detalhes.length ? r.detalhes : r?.dica ? [r.dica] : [];
  const detalhes = todos.filter((d) => !d.startsWith(FONTE));
  const fontes = todos.filter((d) => d.startsWith(FONTE)).map((d) => d.slice(FONTE.length).replace(/^\n/, ''));
  // Detalhes, depois de onde vem cada constatação e, no fim, os comentários do item, quando houver
  $('#lcorpo').innerHTML = linksHtml(r?.links) + detalhes.map((d) => `<div class="ldet">${html(d)}</div>`).join('<br>')
    + (fontes.length ? `<h3>De onde vem</h3>${fontes.map((d) => `<div class="ldet fonte">${html(d)}</div>`).join('')}` : '')
    + (conversa.length ? `<h3>Comentários (${conversa.length})</h3>${conversa.map(cartao).join('')}`
      : PUB && CONVERSAS ? '<h3>Comentários</h3><p class="vazio">Nenhum comentário ainda.</p>' : '');
  $('#lform').hidden = !(PUB && CONVERSAS);
  $('#laviso').textContent = '';
  realcar();
  mostrarLateral();
}

function abrirConversas() {
  aberto = null;
  realcar();
  const grupos = new Map();
  for (const c of [...comentarios].reverse()) (grupos.get(c.item) || grupos.set(c.item, []).get(c.item)).push(c);
  $('#ltitulo').textContent = 'Conversas';
  $('#lcorpo').innerHTML = [...grupos.entries()].map(([item, lista]) => `<button class="conversa" data-abre="${esc(item)}"><b>${esc(lista[0].rotulo || item)}</b> (${lista.length})<small>${esc(lista[0].autor)}: ${esc(lista[0].texto.slice(0, 90))}</small></button>`).join('')
    || '<p class="vazio">Nenhum comentário ainda.</p>';
  $('#lform').hidden = true;
  mostrarLateral();
}

function fecharLateral() {
  aberto = null;
  realcar();
  $('#lateral').classList.remove('aberto');
  document.body.classList.remove('com-lateral');
}

async function rpc(funcao, corpo) {
  const r = await fetch(`${PUB.url}/rest/v1/rpc/${funcao}`, {
    method: 'POST',
    headers: { apikey: PUB.chave, 'Content-Type': 'application/json' },
    body: JSON.stringify(corpo),
  });
  if (!r.ok) throw new Error(`${funcao}: ${r.status}`);
  return r.json();
}

async function comentar() {
  const texto = $('#ltexto').value.trim();
  if (!texto || !aberto) return;
  const botao = $('#lform button');
  botao.disabled = true;
  try {
    comentarios = await rpc('desenho_comentar', { p_token: token, p_item: aberto, p_rotulo: registro[aberto]?.rotulo ?? null, p_texto: texto });
    $('#ltexto').value = '';
    atualizarConversas();
    desenhar();
  } catch {
    $('#laviso').textContent = 'Não foi salvo. O texto continua aqui; tente de novo.';
  } finally {
    botao.disabled = false;
  }
}

const atualizarConversas = () => { $('#conversas').textContent = `Conversas (${comentarios.length})`; };

// ---------------------------------------------------------------- acessos
// Só para quem organiza o desenho: quem tem link, quantos dias faltam e quando entrou. Abre no painel lateral, lido na hora.
const diaBr = (iso) => new Date(iso).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
const diasAte = (iso) => {
  const d = new Date(iso), h = new Date();
  return Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(h.getFullYear(), h.getMonth(), h.getDate())) / 864e5);
};
function situacao(a) {
  if (a.revogado_em) return ['fim', `revogado em ${diaBr(a.revogado_em)}`];
  if (new Date(a.expira_em) <= new Date()) return ['fim', `venceu em ${diaBr(a.expira_em)}`];
  const n = diasAte(a.expira_em);
  return [n <= 3 ? 'alerta' : '', n <= 0 ? 'vence hoje' : n === 1 ? 'falta 1 dia' : `faltam ${n} dias`];
}

async function abrirAcessos() {
  aberto = null;
  realcar();
  esconderDica();
  $('#ltitulo').textContent = 'Acessos';
  $('#lform').hidden = true;
  $('#lcorpo').innerHTML = '<p class="vazio">Lendo os acessos…</p>';
  mostrarLateral();
  let lista;
  try { lista = await rpc('desenho_acessos', { p_token: token }); } catch { lista = null; }
  // se, enquanto lia, a pessoa abriu os detalhes de um item, o painel é dele
  if (aberto || $('#ltitulo').textContent !== 'Acessos') return;
  $('#lcorpo').innerHTML = !lista ? '<p class="vazio">Não foi possível ler os acessos. Tente de novo.</p>'
    : `<table class="tacessos"><thead><tr><th>Pessoa</th><th>Link</th><th title="Vezes que a pessoa abriu a página, e a última atividade">Entradas</th></tr></thead><tbody>${lista.map((a) => {
      const [cls, txt] = situacao(a);
      return `<tr${cls === 'fim' ? ' class="fora"' : ''}><td><b>${esc(a.pessoa)}</b>${a.pessoa === eu ? ' (você)' : ''}<small>${esc(a.email || '')}</small></td>`
        + `<td><span class="${cls}">${esc(txt)}</span><small>até ${esc(diaBr(a.expira_em))}</small></td>`
        + `<td>${Number(a.usos) || 0}<small>${a.ultimo_uso ? `última ${esc(dataHora(a.ultimo_uso))}` : 'nunca entrou'}</small></td></tr>`;
    }).join('')}</tbody></table>`;
}

// ---------------------------------------------------------------- acionáveis
// No topo, valem para o desenho todo: uma linha, um responsável e um prazo. Na página publicada, quem tem link inclui pelo (+);
// ficam no banco, na ordem em que entraram. No painel local não há banco: a seção só avisa onde eles ficam.
// A seção dobra pelo título (o navegador lembra), o cabeçalho resume o que está em andamento, vencido e concluído,
// os concluídos ficam recolhidos no fim da lista e, com a lista longa, um filtro por responsável aparece em cima.
const dataBr = (iso) => String(iso).slice(0, 10).split('-').reverse().join('/');
const hoje = () => new Date().toLocaleDateString('sv-SE');
const plural = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;
const DOBRA = '<svg class="seta" viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 3l3.5 4 3.5-4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>';
const DOBRADO = 'desenho-acionaveis-fechados';
let aFechado = (() => { try { return localStorage.getItem(DOBRADO) === '1'; } catch { return false; } })();
let aQuem = null, verFeitos = false, aNova = null, ordemA = new Map();

// Refazer a lista tira o foco de quem navega pelo teclado: ele volta para o mesmo controle. Com o mouse, não há o que devolver.
let porTeclado = false;
addEventListener('keydown', () => { porTeclado = true; }, true);
addEventListener('mousedown', () => { porTeclado = false; }, true);
const refocar = (seletor) => { if (porTeclado) $(seletor)?.focus({ preventScroll: true }); };

function dobrarAcionaveis(fechar) {
  aFechado = fechar;
  try { if (fechar) localStorage.setItem(DOBRADO, '1'); else localStorage.removeItem(DOBRADO); } catch { }
}

// Prazo: a data é do dia, sem hora; comparar como texto (aaaa-mm-dd) evita o fuso
const vencido = (a) => !!a.prazo && !feito(a) && String(a.prazo).slice(0, 10) < hoje();
function diasDoPrazo(prazo) {
  const [y, m, d] = String(prazo).slice(0, 10).split('-').map(Number), h = new Date();
  return Math.round((new Date(y, m - 1, d) - new Date(h.getFullYear(), h.getMonth(), h.getDate())) / 864e5);
}

// Responsável é texto livre: "Fulano e Beltrano" ou "Fulano, Beltrano" contam para os dois no filtro
const SEM_RESP = '—';
const chaveDe = (s) => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const pessoasDe = (a) => String(a.responsavel || '').split(/\s+e\s+|\s*[,;/]\s*/).map((p) => p.trim()).filter(Boolean);
const chavesDe = (a) => { const p = pessoasDe(a).map(chaveDe); return p.length ? p : [SEM_RESP]; };
const passaFiltro = (a) => aQuem == null || chavesDe(a).includes(aQuem);

// O ✕ de uma linha pede confirmação ali mesmo (sem janela do navegador); excluído, o item fica no banco com quem excluiu.
// O ✎ só aparece para link de organizador (o banco também só aceita a edição dele) e abre a linha no formulário de baixo.
let aExcluir = null, aEditar = null;
// A confirmação fica por cima da linha, encostada à direita: os botões da linha continuam no lugar, invisíveis, e as colunas não mudam de largura.
const ICONE = (nome) => `<svg width="13" height="13" aria-hidden="true"><use href="#i-${nome}"/></svg>`;
function acaoLinha(a) {
  if (!PUB) return '';
  const confirma = aExcluir === a.id, some = confirma ? ' some' : '', fora = confirma ? ' tabindex="-1"' : '';
  return `<td class="ax">${organizador ? `<button type="button" class="ax-b lapis${some}" data-editar="${a.id}" title="Editar este acionável" aria-label="Editar"${fora}>${ICONE('lapis')}</button>` : ''}`
    + `<button type="button" class="ax-b${some}" data-apagar="${a.id}" title="Excluir este acionável" aria-label="Excluir"${fora}>${ICONE('x')}</button>`
    + (confirma ? `<span class="aconf"><button type="button" class="acao perigo" data-confirmar="${a.id}">Excluir</button><button type="button" class="acao" data-cancelar>Cancelar</button></span>` : '')
    + '</td>';
}
const semValor = '<span class="vazio">—</span>';
const quemFez = (a) => `incluído por ${a.autor} em ${dataHora(a.criado_em)}` + (a.editado_por ? ` · editado por ${a.editado_por} em ${dataHora(a.editado_em)}` : '');
// A linha traz só o que fazer: um clique nela abre a página do acionável, com a descrição e os detalhes.
// Quando há descrição, o texto ganha um sublinhado pontilhado e ela aparece na dica ao passar o mouse, como texto puro
// (é escrita por quem tem link).
// O número é o da ordem de entrada e não muda com o filtro; quem incluiu e quem editou ficam na dica do número.
const colunas = () => (PUB ? 6 : 5);
function celulaPrazo(a) {
  if (!a.prazo) return `<td class="ap">${semValor}</td>`;
  const n = diasDoPrazo(a.prazo);
  const falta = feito(a) ? '' : n < 0 ? `venceu há ${plural(-n, 'dia', 'dias')}` : n === 0 ? 'vence hoje' : n === 1 ? 'vence amanhã' : `vence em ${n} dias`;
  return `<td class="ap${vencido(a) ? ' vencido' : ''}"${falta ? ` data-dica="${falta}" data-plano` : ''}>${esc(dataBr(a.prazo))}</td>`;
}
function linhaAcionavel(a) {
  const classes = [aEditar === a.id && 'editando', feito(a) && 'feito', aNova === a.id && 'nova', aExcluir === a.id && 'confirmando'].filter(Boolean).join(' ');
  const oQue = `<td class="at" data-abrir="${a.id}"${a.descricao ? ` data-dica="${esc(a.descricao)}" data-plano data-rodape="Clique para abrir a página deste acionável"` : ''}>`
    + `<span class="alink${a.descricao ? ' com-desc' : ''}" role="link" tabindex="0">${esc(a.texto)}</span></td>`;
  return `<tr${classes ? ` class="${classes}"` : ''}><td class="an" data-dica="${esc(quemFez(a))}" data-plano><span class="num">${ordemA.get(a.id)}</span></td>`
    + oQue
    + `<td class="ar">${a.responsavel ? esc(a.responsavel) : semValor}</td>`
    + `${celulaPrazo(a)}${celulaStatus(a)}${acaoLinha(a)}</tr>`
    // editar abre o formulário logo abaixo da linha, e não no alto da seção
    + (aEditar === a.id ? `<tr class="aedicao"><td colspan="${colunas()}"></td></tr>` : '');
}

// Status: em andamento ou concluído. Na página publicada muda na própria linha; concluído fica verde e o prazo deixa de contar
const STATUS = ['em andamento', 'concluído'];
const feito = (a) => a.status === 'concluído';
function celulaStatus(a) {
  const quem = a.status_por ? ` data-dica="${esc(`${a.status} por ${a.status_por} em ${dataHora(a.status_em)}`)}" data-plano` : '';
  return PUB
    ? `<td class="as"${quem}><select class="ast${feito(a) ? ' feito' : ''}" data-status="${a.id}" aria-label="Status">${STATUS.map((s) => `<option${s === a.status ? ' selected' : ''}>${s}</option>`).join('')}</select></td>`
    : `<td class="as${feito(a) ? ' feito' : ''}"${quem}>${esc(a.status)}</td>`;
}

function resumoAcionaveis() {
  const abertos = acionaveis.filter((a) => !feito(a)), vencidos = abertos.filter(vencido).length, feitos = acionaveis.length - abertos.length;
  const partes = [];
  if (abertos.length) partes.push(`${abertos.length} em andamento` + (vencidos ? ` <span class="vencido">(${vencidos} com prazo vencido)</span>` : ''));
  if (feitos) partes.push(`<span class="feito">${plural(feitos, 'concluído', 'concluídos')}</span>`);
  return partes.join(' · ');
}

// Um botão por responsável, com quantos estão em andamento (✓ quando todos foram concluídos); o de quem entrou vem primeiro.
// Só aparece com a lista longa e mais de um responsável.
function filtroAcionaveis() {
  const grupos = new Map();
  for (const a of acionaveis) {
    const nomes = pessoasDe(a);
    for (const nome of nomes.length ? nomes : [null]) {
      const k = nome ? chaveDe(nome) : SEM_RESP;
      const g = grupos.get(k) || grupos.set(k, { k, nome: nome || 'Sem responsável', abertos: 0 }).get(k);
      if (!feito(a)) g.abertos++;
    }
  }
  if (grupos.size < 2 || acionaveis.length < 6 || (aQuem != null && !grupos.has(aQuem))) aQuem = null;
  if (grupos.size < 2 || acionaveis.length < 6) return '';
  const meu = chaveDe(eu || '').split(' ')[0];
  const peso = (g) => (g.k === SEM_RESP ? 2 : g.k.split(' ')[0] === meu ? 0 : 1);
  const lista = [...grupos.values()].sort((a, b) => peso(a) - peso(b) || b.abertos - a.abertos || a.nome.localeCompare(b.nome, 'pt-BR'));
  const chip = (k, nome, n, ativo) => `<button type="button" class="chip" data-quem="${esc(k)}" aria-pressed="${ativo}"><span>${esc(nome)}</span>${n ? `<b>${n}</b>` : '<b class="ok">✓</b>'}</button>`;
  return chip('', 'Todos', acionaveis.filter((a) => !feito(a)).length, aQuem == null) + lista.map((g) => chip(g.k, g.nome, g.abertos, aQuem === g.k)).join('');
}

function tabelaAcionaveis() {
  const visiveis = acionaveis.filter(passaFiltro);
  if (!visiveis.length) return '';
  const abertos = visiveis.filter((a) => !feito(a)), feitos = visiveis.filter(feito);
  const divisor = feitos.length ? `<tr class="adiv"><td colspan="${colunas()}"><button type="button" id="afeitos" aria-expanded="${verFeitos}">${DOBRA}Concluídos (${feitos.length})</button></td></tr>` : '';
  return `<table><thead><tr><th class="an"></th><th>O que fazer</th><th class="ar">Responsável</th><th class="ap">Prazo</th><th class="as">Status</th>${PUB ? '<th class="ax"></th>' : ''}</tr></thead>`
    + `<tbody>${abertos.map(linhaAcionavel).join('')}${divisor}${verFeitos ? feitos.map(linhaAcionavel).join('') : ''}</tbody></table>`;
}

function mostrarAcionaveis() {
  const form = $('#aform'), corpo = $('#acorpo');
  // o formulário volta ao alto da seção antes de a lista ser refeita; na edição, desce de novo para baixo da linha
  corpo.insertBefore(form, corpo.firstChild);
  // No painel local não há banco nem (+): a seção só aparece na página publicada
  $('#acoes').hidden = !PUB && !acionaveis.length;
  $('#amais').hidden = !PUB || !form.hidden;
  ordemA = new Map(acionaveis.map((a, i) => [a.id, i + 1]));
  $('#aresumo').innerHTML = resumoAcionaveis();
  const filtro = filtroAcionaveis();
  $('#afiltro').innerHTML = filtro;
  $('#afiltro').hidden = !filtro;
  $('#aquem').innerHTML = [...new Set(acionaveis.map((a) => a.responsavel).filter(Boolean))].map((r) => `<option value="${esc(r)}">`).join('');
  $('#alista').innerHTML = tabelaAcionaveis();
  aNova = null;
  // a página do acionável é refeita aqui, com o formulário ainda fora dela; na edição, ele entra na página ou desce para baixo da linha
  mostrarPaginaAcionavel();
  $('#adet-cx').hidden = !(aEditar != null && aPagina === aEditar);
  if (aEditar != null && !form.hidden) (aPagina === aEditar ? $('#pedicao') : $('#alista .aedicao td'))?.appendChild(form);
  // sem acionável não há o que dobrar; com o formulário aberto a seção fica aberta
  $('.acab').classList.toggle('dobra', acionaveis.length > 0);
  $('#adobra').disabled = !acionaveis.length;
  corpo.hidden = aFechado && acionaveis.length > 0 && form.hidden;
  $('#adobra').setAttribute('aria-expanded', String(!corpo.hidden));
}

$('.acab').addEventListener('click', (e) => {
  if (e.target.closest('#amais') || !acionaveis.length || !$('#aform').hidden) return;
  dobrarAcionaveis(!aFechado);
  mostrarAcionaveis();
});
$('#afiltro').addEventListener('click', (e) => {
  const b = e.target.closest('.chip');
  if (!b) return;
  aQuem = b.dataset.quem || null;
  mostrarAcionaveis();
  refocar('#afiltro .chip[aria-pressed="true"]');
});

async function mudarStatus(sel) {
  $('#aerro').textContent = '';
  sel.disabled = true;
  try {
    acionaveis = await rpc('desenho_acionavel_status', { p_token: token, p_id: Number(sel.dataset.status), p_status: sel.value });
  } catch {
    $('#aerro').textContent = 'O status não foi salvo. Tente de novo.';
  }
  mostrarAcionaveis();
}
$('#alista').addEventListener('change', (e) => { if (e.target.matches('select[data-status]')) mudarStatus(e.target); });

async function excluirAcionavel(id) {
  $('#aerro').textContent = '';
  try {
    acionaveis = await rpc('desenho_desacionar', { p_token: token, p_id: id });
    aExcluir = null;
  } catch {
    $('#aerro').textContent = 'Não foi excluído. Tente de novo.';
  }
  mostrarAcionaveis();
}

$('#alista').addEventListener('click', (e) => {
  if (e.target.closest('#aform')) return;
  const b = e.target.closest('button');
  if (b) {
    if (b.dataset.editar) abrirFormAcionavel(true, acionaveis.find((a) => a.id === Number(b.dataset.editar)));
    else if (b.dataset.apagar) { aExcluir = Number(b.dataset.apagar); mostrarAcionaveis(); }
    else if (b.dataset.confirmar) { b.disabled = true; excluirAcionavel(Number(b.dataset.confirmar)); }
    else if ('cancelar' in b.dataset) { aExcluir = null; mostrarAcionaveis(); }
    else if (b.id === 'afeitos') { verFeitos = !verFeitos; mostrarAcionaveis(); refocar('#afeitos'); }
    return;
  }
  // a célula inteira abre a página do acionável; selecionar texto para copiar não conta como clique
  const td = e.target.closest('td[data-abrir]');
  if (td && !String(getSelection()).trim()) abrirAcionavel(Number(td.dataset.abrir));
});
$('#alista').addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.alink')) { e.preventDefault(); abrirAcionavel(Number(e.target.closest('td').dataset.abrir)); }
});

// O mesmo formulário inclui (pelo +, no alto da seção) e edita (pelo ✎, sob a linha, preenchido com ela). Só "o que fazer" é obrigatório.
function abrirFormAcionavel(abrir, a = null) {
  aEditar = abrir && a ? a.id : null;
  if (abrir && aPagina == null) dobrarAcionaveis(false);
  $('#aform').reset();
  if (a) {
    $('#atexto').value = a.texto;
    $('#aresp').value = a.responsavel ?? '';
    $('#aprazo').value = a.prazo ? String(a.prazo).slice(0, 10) : '';
    $('#adesc').value = a.descricao ?? '';
    $('#adet').value = a.detalhes ?? '';
  }
  $('#aform [type="submit"]').textContent = aEditar ? 'Salvar' : 'Incluir';
  $('#aform').hidden = !abrir;
  $('#aaviso').textContent = '';
  mostrarAcionaveis();
  if (abrir) $('#atexto').focus();
}

async function salvarAcionavel() {
  const texto = $('#atexto').value.trim();
  if (!texto) { $('#aaviso').textContent = 'Preencha o que fazer.'; return; }
  const campos = { p_token: token, p_texto: texto, p_responsavel: $('#aresp').value.trim() || null, p_prazo: $('#aprazo').value || null, p_descricao: $('#adesc').value.trim() || null };
  const botao = $('#aform [type="submit"]');
  botao.disabled = true;
  try {
    const antes = new Set(acionaveis.map((a) => a.id));
    // os detalhes só se editam na página do acionável, por quem organiza, e vão por uma chamada própria
    const detalhes = aEditar != null && aPagina === aEditar ? $('#adet').value.trim() || null : undefined;
    const eraDet = acionaveis.find((a) => a.id === aEditar)?.detalhes ?? null;
    acionaveis = aEditar ? await rpc('desenho_acionavel_editar', { ...campos, p_id: aEditar }) : await rpc('desenho_acionar', campos);
    if (detalhes !== undefined && detalhes !== eraDet) acionaveis = await rpc('desenho_acionavel_detalhar', { p_token: token, p_id: aEditar, p_detalhes: detalhes });
    // o que acabou de entrar aparece: sai do filtro se não couber nele, pisca e rola até ficar à vista
    const nova = acionaveis.find((a) => !antes.has(a.id));
    if (nova) { aNova = nova.id; if (!passaFiltro(nova)) aQuem = null; }
    abrirFormAcionavel(false);
    $('#alista tr.nova')?.scrollIntoView({ block: 'nearest' });
  } catch {
    $('#aaviso').textContent = 'Não foi salvo. O texto continua aqui; tente de novo.';
  } finally {
    botao.disabled = false;
  }
}

$('#amais').addEventListener('click', () => abrirFormAcionavel(true));
$('#acancelar').addEventListener('click', () => abrirFormAcionavel(false));
$('#aform').addEventListener('submit', (e) => { e.preventDefault(); salvarAcionavel(); });
$('#adesc').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); salvarAcionavel(); }
});

// ---------------------------------------------------------------- página do acionável
// Cada acionável abre numa página própria, em tela cheia, no lugar do desenho. Limpa, sem caixa: o que fazer no alto, com
// o responsável, o prazo e o status num canto, uma linha preta e, embaixo, a descrição e os detalhes direto na tela.
// Não tem respostas nem comentários (Eduardo, 11/11): quem organiza põe a atualização no próprio texto, pelo Editar.
// O endereço ganha #acionavel=N, que serve de link. "Voltar", Esc ou o voltar do navegador devolvem a pessoa ao ponto de onde ela veio.
let aPagina = null, aVolta = 0;
// a página anda pela mesma lista que a pessoa via: a filtrada, quando o acionável aberto está nela
const vizinhosA = () => { const l = acionaveis.filter(passaFiltro); return l.some((a) => a.id === aPagina) ? l : acionaveis; };

// Detalhes: texto de quem organiza, mostrado com estrutura leve. "## " abre uma seção, "- " faz um item de lista (uma linha
// recuada continua o item), linha em branco separa parágrafos; dentro da linha vale a marcação curta (**negrito**, `código`).
// "[[aba:Nome]]" vira um atalho para a aba do desenho com esse nome. Tudo passa pelo esc() antes de virar HTML.
function corpoHtml(s) {
  const out = [];
  let par = [], lista = [];
  const linhas = (t) => t.split('\n').map(html).join('<br>');
  const fechar = () => {
    if (par.length) out.push(`<p>${par.map(html).join('<br>')}</p>`);
    if (lista.length) out.push(`<ul>${lista.map((l) => `<li>${linhas(l)}</li>`).join('')}</ul>`);
    par = []; lista = [];
  };
  for (const bruta of String(s ?? '').split('\n')) {
    const l = bruta.trimEnd();
    if (!l.trim()) fechar();
    else if (l.startsWith('## ')) { fechar(); out.push(`<h3>${html(l.slice(3))}</h3>`); }
    else if (l.startsWith('- ')) { if (par.length) fechar(); lista.push(l.slice(2)); }
    else if (lista.length && /^\s{2,}\S/.test(l)) lista[lista.length - 1] += `\n${l.trim()}`;
    else { if (lista.length) fechar(); par.push(l.trim()); }
  }
  fechar();
  return out.join('').replace(/\[\[aba:([^\]]+)\]\]/g, (m, nome) => {
    const i = doc.paginas.findIndex((p) => esc(p.nome) === nome);
    return i < 0 ? `aba ${nome}` : `<button type="button" class="pg-aba" data-ir-aba="${i}">aba ${nome}</button>`;
  });
}

function paginaAcionavelHtml(a) {
  const n = a.prazo ? diasDoPrazo(a.prazo) : 0;
  const falta = !a.prazo || feito(a) ? '' : n < 0 ? `venceu há ${plural(-n, 'dia', 'dias')}` : n === 0 ? 'vence hoje' : n === 1 ? 'vence amanhã' : `vence em ${n} dias`;
  const prazo = a.prazo ? `<span${vencido(a) ? ' class="vencido"' : ''}>${esc(dataBr(a.prazo))}</span>${falta ? `<small>${falta}</small>` : ''}` : semValor;
  // quem mudou o status fica na dica, como na lista
  const quem = a.status_por ? ` data-dica="${esc(`${a.status} por ${a.status_por} em ${dataHora(a.status_em)}`)}" data-plano` : '';
  const status = PUB
    ? `<select class="ast${feito(a) ? ' feito' : ''}" data-status="${a.id}" aria-label="Status">${STATUS.map((s) => `<option${s === a.status ? ' selected' : ''}>${s}</option>`).join('')}</select>`
    : esc(a.status);
  const texto = a.descricao || a.detalhes
    ? `${a.descricao ? `<p class="pg-resumo">${esc(a.descricao)}</p>` : ''}${a.detalhes ? `<div class="pg-corpo">${corpoHtml(a.detalhes)}</div>` : ''}`
    : '<p class="vazio">Este acionável não tem descrição.</p>';
  return `<article class="pg${feito(a) ? ' feito' : ''}">`
    + `<header class="pg-cab"><span class="num">${ordemA.get(a.id)}</span><h2>${esc(a.texto)}</h2>`
    + `<div class="pg-lado"><dl class="pg-meta"><dt>Responsável</dt><dd>${a.responsavel ? esc(a.responsavel) : semValor}</dd>`
    + `<dt>Prazo</dt><dd>${prazo}</dd><dt>Status</dt><dd${quem}>${status}</dd></dl>`
    + `${organizador && aEditar !== a.id ? '<button type="button" id="peditar" class="acao">Editar</button>' : ''}</div></header>`
    + '<div id="pedicao"></div>'
    + `<div class="pg-texto">${texto}</div>`
    + `<footer class="pg-rodape">${esc(quemFez(a))}</footer></article>`;
}

// Chamada só por mostrarAcionaveis(), com o formulário fora da página: refaz a página aberta, ou a fecha se o acionável saiu
function mostrarPaginaAcionavel() {
  const a = aPagina == null ? null : acionaveis.find((x) => x.id === aPagina);
  const pg = $('#apagina');
  if (!a) {
    if (aPagina != null) { aPagina = null; history.replaceState(null, '', `#aba=${pag + 1}`); }
    pg.hidden = true;
    pg.innerHTML = '';
    $('#pnav').hidden = true;
    document.body.classList.remove('na-pagina');
    return;
  }
  pg.innerHTML = paginaAcionavelHtml(a);
  pg.hidden = false;
  document.body.classList.add('na-pagina');
  const lista = vizinhosA(), i = lista.findIndex((x) => x.id === a.id);
  $('#pnav').hidden = false;
  $('#ponde').textContent = `Acionável ${i + 1} de ${lista.length}` + (lista.length < acionaveis.length ? ' no filtro' : '');
  $('#pant').disabled = i <= 0;
  $('#pprox').disabled = i >= lista.length - 1;
}

function abrirAcionavel(id, { empilhar = true } = {}) {
  if (!acionaveis.some((a) => a.id === id)) return;
  if (aPagina == null) aVolta = scrollY;
  esconderDica();
  if ($('#lateral').classList.contains('aberto')) fecharLateral();
  aPagina = id;
  // vindo da lista, a página entra no histórico do navegador: o voltar dele devolve a lista
  if (empilhar) history.pushState({ acionavel: id, daLista: true }, '', `#acionavel=${id}`);
  else history.replaceState({ ...history.state, acionavel: id }, '', `#acionavel=${id}`);
  if (aEditar != null || !$('#aform').hidden) abrirFormAcionavel(false); else mostrarAcionaveis();
  scrollTo(0, 0);
}

function sairDoAcionavel() {
  aPagina = null;
  if (aEditar != null) abrirFormAcionavel(false); else mostrarAcionaveis();
  scrollTo(0, aVolta);
}

// "Voltar": quem veio da lista volta pelo histórico do navegador; quem abriu direto pelo link vai para o desenho
function fecharAcionavel() {
  if (history.state?.daLista) { history.back(); return; }
  history.replaceState(null, '', `#aba=${pag + 1}`);
  sairDoAcionavel();
}

addEventListener('popstate', () => {
  if (!doc) return;
  const id = Number(new URLSearchParams(location.hash.slice(1)).get('acionavel')) || null;
  if (id && acionaveis.some((a) => a.id === id)) {
    if (aPagina == null) aVolta = scrollY;
    aPagina = id;
    if (aEditar != null) abrirFormAcionavel(false); else mostrarAcionaveis();
    scrollTo(0, 0);
  } else if (aPagina != null) sairDoAcionavel();
});

function vizinhoAcionavel(passo) {
  const lista = vizinhosA(), a = lista[lista.findIndex((x) => x.id === aPagina) + passo];
  if (a) abrirAcionavel(a.id, { empilhar: false });
}
$('#pvoltar').addEventListener('click', fecharAcionavel);
$('#pant').addEventListener('click', () => vizinhoAcionavel(-1));
$('#pprox').addEventListener('click', () => vizinhoAcionavel(1));

$('#apagina').addEventListener('click', (e) => {
  if (e.target.closest('#aform')) return;
  if (e.target.closest('#peditar')) { abrirFormAcionavel(true, acionaveis.find((a) => a.id === aPagina)); return; }
  const aba = e.target.closest('[data-ir-aba]');
  if (!aba) return;
  // o atalho para uma aba do desenho entra no histórico: o voltar do navegador devolve a página do acionável
  sairDoAcionavel();
  pag = Number(aba.dataset.irAba);
  history.pushState(null, '', `#aba=${pag + 1}`);
  desenhar();
  scrollTo(0, 0);
});
$('#apagina').addEventListener('change', (e) => { if (e.target.matches('select[data-status]')) mudarStatus(e.target); });

function montar() {
  $('#titulo').textContent = doc.meta?.titulo || NOME;
  document.title = doc.meta?.titulo || 'Desenho';
  mostrarAcionaveis();
  // Abas ocultas: uma página com "oculta": true fica fora da fileira de abas e abre pelo menu do canto direito.
  // No painel local quem abre é sempre quem organiza. Na página publicada o banco só entrega essas páginas ao link
  // de organizador; se uma chegar a outro link, sai aqui antes de qualquer coisa ser desenhada.
  if (PUB && !organizador) doc.paginas = doc.paginas.filter((p) => !p.oculta);
  if (!doc.paginas.length) throw new Error('Este desenho ainda não tem aba para mostrar.');
  $('#abas').innerHTML = doc.paginas.map((p, i) => (p.oculta ? '' : `<button type="button" class="aba" role="tab" data-aba="${i}">${esc(p.nome)}</button>`)).join('');
  const ocultas = doc.paginas.map((p, i) => [p, i]).filter(([p]) => p.oculta);
  $('#ocultas-cx').hidden = !ocultas.length;
  $('#ocultas-menu').innerHTML = ocultas.map(([p, i]) => `<button type="button" data-aba="${i}">${esc(p.nome)}</button>`).join('');
  fecharOcultas();
  pag = Math.min(pag, doc.paginas.length - 1);
  // sem pedido no endereço (#aba=N), o desenho abre na primeira aba que todos veem
  if (doc.paginas[pag].oculta && !abaPedida) pag = Math.max(0, doc.paginas.findIndex((p) => !p.oculta));
  desenhar();
}

function fecharOcultas() {
  $('#ocultas-menu').hidden = true;
  $('#ocultas').setAttribute('aria-expanded', 'false');
}
$('#ocultas').addEventListener('click', () => {
  const m = $('#ocultas-menu');
  m.hidden = !m.hidden;
  $('#ocultas').setAttribute('aria-expanded', String(!m.hidden));
});
$('#ocultas-menu').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-aba]');
  if (!b) return;
  // da página de um acionável, escolher uma aba oculta volta ao desenho antes de trocar de aba
  if (aPagina != null) { aPagina = null; if (aEditar != null) abrirFormAcionavel(false); else mostrarAcionaveis(); }
  pag = Number(b.dataset.aba);
  history.replaceState(null, '', `#aba=${pag + 1}`);
  fecharOcultas();
  desenhar();
});
document.addEventListener('mousedown', (e) => { if (!e.target.closest('#ocultas-cx')) fecharOcultas(); });
// Esc com o menu aberto fecha só o menu: o Esc geral (cartão, painel lateral) não chega a rodar
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape' || $('#ocultas-menu').hidden) return;
  e.stopImmediatePropagation();
  fecharOcultas();
  $('#ocultas').focus();
}, true);

async function pedir(url) {
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  return r.json();
}

async function abrir(arquivo) {
  doc = await pedir(`/api/desenho/${encodeURIComponent(NOME)}/${encodeURIComponent(arquivo)}`);
  if (doc.formato !== 2) throw new Error('Esta versão é de um formato antigo, que a página não mostra mais.');
  montar();
}

$('#abas').addEventListener('click', (e) => {
  const a = e.target.closest('.aba');
  if (!a) return;
  pag = Number(a.dataset.aba);
  history.replaceState(null, '', `#aba=${pag + 1}`);
  desenhar();
});

$('#versao').addEventListener('change', (e) => abrir(e.target.value).catch(falhar));

// Os detalhes abrem pelo botão "Ver detalhes" do cartão de cada item, não pelo clique na caixa (Eduardo, 06/11)

$('#lfechar').addEventListener('click', fecharLateral);
$('#conversas').addEventListener('click', abrirConversas);
$('#acessos').addEventListener('click', abrirAcessos);
$('#lcorpo').addEventListener('click', (e) => {
  const b = e.target.closest('[data-abre]');
  if (b) abrirItem(b.dataset.abre);
});
$('#lform').addEventListener('submit', (e) => { e.preventDefault(); comentar(); });
// Um link novo aberto na mesma aba só muda o fim do endereço: sem recarregar, a página ficaria com o acesso anterior
window.addEventListener('hashchange', () => { if (PUB && location.hash.includes('acesso=')) location.reload(); });
$('#ltexto').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); comentar(); }
});

// ---------------------------------------------------------------- dica
// Passar o mouse mostra a explicação. Publicada, a dica de um item traz também os comentários e o botão de responder:
// ela para ao lado do item e troca ou some na hora, menos quando o mouse vai na direção dela; enquanto alguém escreve, fica presa.
const dica = { item: null, texto: '', fixa: false, timer: 0, rascunhos: {}, ancora: null };

function esconderDica() {
  clearTimeout(dica.timer);
  dica.item = null;
  dica.fixa = false;
  $('#dica').style.display = 'none';
  $('#dica').classList.remove('viva');
}

function dicaSimples(texto, e, plano = false, rodape = '') {
  esconderDica();
  const d = $('#dica');
  d.innerHTML = (plano ? esc(texto) : html(texto)) + (rodape ? `<div class="drodape">${esc(rodape)}</div>` : '');
  d.style.display = 'block';
  const x = Math.min(e.clientX + 16, innerWidth - d.offsetWidth - 8);
  const y = e.clientY + 18 + d.offsetHeight > innerHeight ? e.clientY - d.offsetHeight - 12 : e.clientY + 18;
  d.style.left = `${Math.max(8, x)}px`;
  d.style.top = `${Math.max(8, y)}px`;
}

function conteudoCartao() {
  const conversa = comentarios.filter((c) => c.item === dica.item);
  return `<div class="dtexto">${html(dica.texto)}</div>`
    + linksHtml(registro[dica.item]?.links)
    + (conversa.length ? `<div class="dconversa">${conversa.map(cartao).join('')}</div>` : '')
    + (dica.fixa
      ? `<form id="dform"><textarea id="dcampo" rows="3" maxlength="4000" placeholder="Escreva sua resposta ou comentário"></textarea>`
        + `<div class="lacoes"><span id="daviso"></span><span class="dbotoes"><button type="button" id="dcancelar" class="acao">Cancelar</button><button type="submit" class="acao">Enviar</button></span></div></form>`
      : `<div class="dacoes"><span>${conversa.length ? `${conversa.length} comentário${conversa.length > 1 ? 's' : ''}` : ''}</span><span class="dbotoes"><button type="button" id="ddetalhes" class="acao">Ver detalhes</button>`
        + `${PUB ? `<button type="button" id="dresponder" class="acao">${conversa.length ? 'Responder' : 'Comentar'}</button>` : ''}</span></div>`);
}

// Redesenha o cartão no lugar e o mantém dentro da tela quando ele cresce.
function renderCartao() {
  const d = $('#dica');
  d.innerHTML = conteudoCartao();
  const topo = parseFloat(d.style.top) || 8;
  if (topo + d.offsetHeight > innerHeight - 8) d.style.top = `${Math.max(8, innerHeight - d.offsetHeight - 8)}px`;
}

function cartaoItem(g, texto, e) {
  esconderDica();
  const d = $('#dica');
  dica.item = g.dataset.item;
  dica.texto = texto;
  d.classList.add('viva');
  d.innerHTML = conteudoCartao();
  d.style.display = 'block';
  // Ao lado direito do item, para chegar nele sem passar por outro; perto do mouse quando o item é largo
  const r = g.getBoundingClientRect();
  let x = r.right + 8;
  if (x - e.clientX > 260) x = e.clientX + 24;
  if (x + d.offsetWidth > innerWidth - 8) x = Math.min(r.left, e.clientX) - d.offsetWidth - 8;
  if (x < 8) x = Math.min(e.clientX + 24, innerWidth - d.offsetWidth - 8);
  d.style.left = `${Math.max(8, x)}px`;
  d.style.top = `${Math.max(8, Math.min(e.clientY - 20, innerHeight - d.offsetHeight - 8))}px`;
}

// O mouse vai na direção do cartão? Vale o triângulo entre o último ponto sobre o item e a borda do cartão que fica de frente para ele.
const lado = (p, q, r) => (q[0] - p[0]) * (r[1] - p[1]) - (q[1] - p[1]) * (r[0] - p[0]);
function rumoAoCartao(x, y) {
  const a = dica.ancora;
  if (!a) return false;
  if (Math.hypot(x - a[0], y - a[1]) < 3) return true;
  const b = $('#dica').getBoundingClientRect(), f = 12;
  const borda = a[0] <= b.left ? [[b.left, b.top - f], [b.left, b.bottom + f]]
    : a[0] >= b.right ? [[b.right, b.top - f], [b.right, b.bottom + f]]
    : a[1] <= b.top ? [[b.left - f, b.top], [b.right + f, b.top]]
    : [[b.left - f, b.bottom], [b.right + f, b.bottom]];
  const p = [x, y], d1 = lado(p, a, borda[0]), d2 = lado(p, borda[0], borda[1]), d3 = lado(p, borda[1], a);
  return !((d1 < 0 || d2 < 0 || d3 < 0) && (d1 > 0 || d2 > 0 || d3 > 0));
}

document.addEventListener('mousemove', (e) => {
  if (e.target.closest?.('#dica')) { clearTimeout(dica.timer); return; }
  if (dica.fixa) return;
  // sobre o botão de uma seção que recolhe não há cartão: em tela estreita ele cobriria o botão
  if (e.target.closest?.('[data-dobra]')) { esconderDica(); return; }
  const alvo = e.target.closest?.('[data-dica], #quadro [data-item]');
  const g = alvo?.closest('#quadro [data-item]');
  const r = g && registro[g.dataset.item];
  const texto = alvo?.getAttribute('data-dica') || r?.dica || r?.rotulo || '';
  const viva = $('#dica').classList.contains('viva');
  const ev = { clientX: e.clientX, clientY: e.clientY };
  if (g && viva && g.dataset.item === dica.item) {
    clearTimeout(dica.timer);
    dica.ancora = [e.clientX, e.clientY];
    if (texto !== dica.texto) { dica.texto = texto; $('#dica .dtexto').innerHTML = html(texto); }
    return;
  }
  const seguir = g ? () => { cartaoItem(g, texto, ev); dica.ancora = [ev.clientX, ev.clientY]; } : alvo && texto ? () => dicaSimples(texto, ev, alvo.hasAttribute('data-plano'), alvo.dataset.rodape) : esconderDica;
  clearTimeout(dica.timer);
  // A caminho do cartão, ele espera; se o mouse parar antes de chegar, segue para onde o mouse está
  if (viva && rumoAoCartao(e.clientX, e.clientY)) dica.timer = setTimeout(seguir, 300);
  else seguir();
});

async function responder() {
  const id = dica.item, t = $('#dcampo')?.value.trim();
  if (!t || !id) return;
  const botao = $('#dform [type="submit"]');
  botao.disabled = true;
  try {
    comentarios = await rpc('desenho_comentar', { p_token: token, p_item: id, p_rotulo: registro[id]?.rotulo ?? null, p_texto: t });
    delete dica.rascunhos[id];
    dica.fixa = false;
    atualizarConversas();
    desenhar();
    renderCartao();
  } catch {
    $('#daviso').textContent = 'Não foi salvo. O texto continua aqui; tente de novo.';
    botao.disabled = false;
  }
}

$('#dica').addEventListener('click', (e) => {
  if (e.target.closest('#ddetalhes')) {
    const id = dica.item;
    esconderDica();
    abrirItem(id);
  } else if (e.target.closest('#dresponder')) {
    dica.fixa = true;
    renderCartao();
    $('#dcampo').value = dica.rascunhos[dica.item] || '';
    $('#dcampo').focus();
  } else if (e.target.closest('#dcancelar')) {
    delete dica.rascunhos[dica.item];
    dica.fixa = false;
    renderCartao();
  }
});
$('#dica').addEventListener('submit', (e) => { e.preventDefault(); responder(); });
$('#dica').addEventListener('input', (e) => { if (e.target.id === 'dcampo') dica.rascunhos[dica.item] = e.target.value; });
$('#dica').addEventListener('keydown', (e) => {
  if (e.target.id === 'dcampo' && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); responder(); }
});
// Esc ou um clique fora fecham; o que estava escrito fica guardado para quando a pessoa voltar ao item.
// Sem cartão aberto, o Esc fecha o painel lateral.
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  const cartao = $('#dica').classList.contains('viva');
  esconderDica();
  if (cartao) return;
  if ($('#lateral').classList.contains('aberto')) { fecharLateral(); return; }
  // na página de um acionável, Esc volta; com o formulário de edição aberto ou um campo em uso, não
  if (aPagina != null && $('#aform').hidden && !/^(TEXTAREA|INPUT|SELECT)$/.test(document.activeElement?.tagName || '')) fecharAcionavel();
});
document.addEventListener('mousedown', (e) => { if (dica.fixa && !e.target.closest('#dica')) esconderDica(); });
addEventListener('scroll', (e) => { if (!dica.fixa && !(e.target instanceof Element && e.target.closest('#dica'))) esconderDica(); }, true);

function falhar(erro) {
  $('#quadro').innerHTML = `<div id="erro">${esc(erro.message || erro)}</div>`;
}

// Publicada: o link pessoal vem no endereço e sai da barra. O navegador o guarda (localStorage) até ele vencer ou ser revogado,
// então fechar a aba não pede o link de novo. O que ficou guardado da versão anterior, só na aba (sessionStorage), passa para cá.
const GUARDA = 'desenho-acesso';
const lerAcesso = () => { try { return localStorage.getItem(GUARDA) || sessionStorage.getItem(GUARDA); } catch { return null; } };
const gravarAcesso = (t) => { try { localStorage.setItem(GUARDA, t); sessionStorage.removeItem(GUARDA); } catch { } };
const esquecerAcesso = () => { try { localStorage.removeItem(GUARDA); sessionStorage.removeItem(GUARDA); } catch { } };

async function iniciarPublicado(hash) {
  const doLink = hash.get('acesso');
  token = doLink || lerAcesso();
  // o link pessoal sai da barra; o que fica é a aba ou o acionável pedido, que servem de endereço para mandar a alguém
  const pedido = Number(hash.get('acionavel')) || null;
  history.replaceState(null, '', location.pathname + (pedido ? `#acionavel=${pedido}` : hash.get('aba') ? `#aba=${hash.get('aba')}` : ''));
  $('#versao').hidden = true;
  let r = null;
  // sem resposta do banco, nada é esquecido: o link guardado continua valendo e um link novo volta para o endereço, para o recarregar funcionar
  try { if (token) r = await rpc('desenho_abrir', { p_token: token }); } catch {
    if (doLink) history.replaceState(null, '', `${location.pathname}#acesso=${doLink}${pedido ? `&acionavel=${pedido}` : ''}`);
    falhar('Não foi possível abrir o desenho agora. Recarregue a página em alguns instantes.');
    return;
  }
  if (!r) {
    // um link guardado que não abre mais é esquecido; um link novo que não abre não apaga o que estava guardado
    if (token && !doLink) esquecerAcesso();
    falhar(token ? 'Este link venceu ou foi revogado. Peça um novo à 3Neuron.' : 'Esta página abre pelo seu link pessoal. Abra o link que a 3Neuron mandou para você.');
    return;
  }
  gravarAcesso(token);
  doc = r.conteudo;
  comentarios = r.comentarios;
  acionaveis = r.acionaveis ?? [];
  eu = r.pessoa;
  $('#quem').hidden = false;
  $('#quem').textContent = `Você entrou como ${r.pessoa}` + (r.expira_em ? ` · seu link vale até ${diaBr(r.expira_em)}` : '');
  organizador = !!r.organizador;
  $('#acessos').hidden = !organizador;
  $('#conversas').hidden = !CONVERSAS;
  atualizarConversas();
  montar();
  // endereço com #acionavel=N: abre direto na página dele; se ele não existe mais, fica o desenho
  if (pedido && acionaveis.some((a) => a.id === pedido)) abrirAcionavel(pedido, { empilhar: false });
  else if (pedido) history.replaceState(null, '', location.pathname);
}

(async function iniciar() {
  try {
    const hash = new URLSearchParams(location.hash.slice(1));
    pag = Math.max(0, (Number(hash.get('aba')) || 1) - 1);
    abaPedida = hash.has('aba');
    if (PUB) { await iniciarPublicado(hash); return; }
    const { versoes } = await pedir(`/api/desenho/${encodeURIComponent(NOME)}`);
    if (!versoes.length) throw new Error('Este desenho ainda não tem versão.');
    $('#versao').innerHTML = versoes.map((v) => `<option value="${esc(v.arquivo)}">${esc(v.rotulo || v.arquivo)}</option>`).join('');
    await abrir(versoes[0].arquivo);
  } catch (erro) { falhar(erro); }
})();
